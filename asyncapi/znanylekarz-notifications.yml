note: >-
  ZnanyLekarz publishes NO AsyncAPI document. It does publish a complete, first-class event
  surface, and unusually it publishes it INSIDE the OpenAPI: the POST /{client-endpoint-url}
  operation carries 17 OpenAPI 3.0 `callbacks` entries, each with a named event key, a summary,
  a $ref'd notification schema and documented response semantics. This artifact is that catalog,
  derived verbatim from those callback definitions plus the push-vs-pull guide. Nothing here is
  authored — every event name, schema name and response code is read out of the contract.
delivery:
  modes:
  - mode: push
    description: >-
      Docplanner POSTs event data to a client-supplied endpoint URL in real time. "Regardless of
      the response status (500, 200, 400) from the client endpoint, the events will be pushed
      only once" for ordinary events; failed pushes are retried twice more, after 5 and 10 minutes.
    retries: 2
    retry_schedule: [5 minutes, 10 minutes]
    recovery: POST /notifications/release
    recovery_limit: 1 request per hour
    retention: Failed notifications are permanently deleted 14 days after creation.
  - mode: pull
    description: >-
      The client polls GET /notifications for the earliest unpulled notification (FIFO, one per
      request), or GET /notifications/multiple for up to 100 at a time with a remaining count.
    endpoints:
    - GET /notifications
    - GET /notifications/multiple
    - POST /notifications/release
    retention: Notifications not pulled within 72 hours are marked expired and deleted.
    content_type: application/vnd.docplanner+json; charset=UTF-8
  both_supported: true
  transport: HTTPS POST from a single Docplanner IP address
  ip_allowlist: https://www.znanylekarz.pl/public/docs/public-ips.json
  ip_allowlist_note: >-
    Machine-readable IP allowlist served per locale at /public/docs/public-ips.json (HTTP 200,
    application/json, an "API" key holding the source addresses) — the templated form
    https://www.{domain}/public/docs/public-ips.json is referenced from the contract itself.
signature_verification:
  supported: false
  note: >-
    No webhook signing secret, HMAC header or message-signature scheme is documented. Receiver
    authenticity rests on the published source-IP allowlist alone. Recorded as a gap, not invented.
