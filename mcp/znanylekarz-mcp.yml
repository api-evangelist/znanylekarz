agent_readiness_caveat: >-
  This is a write-heavy clinical scheduling surface with no idempotency mechanism and no dry-run
  mode. An agent that retries a failed book_slot, publish_slots or move_booking has no protection
  against duplicating a real patient appointment. Any MCP server over this API should add
  idempotency at the server layer before exposing the write tools.
