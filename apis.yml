    Ownership confirmed from the spec itself, not from the fetch URL: its Fundamentals section maps
    Poland -> znanylekarz.pl, and https://www.znanylekarz.pl/api/v3/integration/facilities returns
    401 live. No MCP server, no agent card, no llms.txt, no AsyncAPI.
