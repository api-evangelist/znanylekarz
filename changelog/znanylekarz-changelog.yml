- version: 1.14.0
  date: null
  breaking: false
  additions: 1
  highlights:
  - Introducing new optional apply_on_coupled_addresses field in AddCalendarBreakRequest for creating the same break
    on the doctor's coupled addresses in the facility
  - moveCalendarBreak and deleteCalendarBreak now move and remove those coupled breaks together with the break they
    follow
- version: 1.13.0
  date: null
  breaking: false
  additions: 0
  highlights:
  - moveBooking may now move a booking to an address_id belonging to a different doctor within the same facility,
    reassigning the booking to that doctor. An address outside the facility named in the path is still rejected
    with 403
  - moveBooking returns 422 Unprocessable Entity when the booking still holds money and the target address is billed
    through a different payment account. Cancel the booking and create a new one instead. A payment that was fully
    refunded or charged back holds no money, so it does not restrict the move
