note: 'Docplanner ships its API changelog INSIDE the contract, as an x-changelog extension on the OpenAPI info object
  keyed by semantic version. That is unusual and worth recording: a client that has the spec has the entire release
  history without visiting the docs site. All 70 documented versions are captured below, with markdown bold markers
  removed and wording otherwise unchanged. No entry carries a DATE — the changelog is version-keyed only — so every
  date field is null rather than guessed. The rendered page at integrations.docplanner.com/guide/changelog/ returns
  HTTP 200 but renders its entries client-side, so the contract is the readable source.'
