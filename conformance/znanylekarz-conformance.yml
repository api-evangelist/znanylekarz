note: >-
  Cross-cutting standards asserted only where the contract or the docs actually demonstrate them.
  ZnanyLekarz operates in EU healthcare, where a real domain standard exists (HL7 / FHIR), and the
  honest finding is that this API does not speak it: it is a bespoke booking and calendar contract.
  That is recorded as conforms:false with evidence rather than left out, because the distinction
  matters to a buyer — an EHR vendor integrating here needs a bespoke connector, not a FHIR client.
  No certification or audit report is claimed: trust.docplanner.com was fetched and is a content-
  moderation Trust and Transparency Report, naming no SOC 2, ISO 27001, PCI DSS or HIPAA
  certification, so no Compliance pointer is emitted in apis.yml.
