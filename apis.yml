aid: znanylekarz
name: ZnanyLekarz
description: >-
  ZnanyLekarz is the Polish healthcare marketplace and practice-management platform operated by
  Docplanner Group, connecting patients with over 146,000 listed doctors and equipping medical
  practices with online booking, calendar management, appointment reminders, patient reviews,
  e-prescriptions, video consultations and online payments. ZnanyLekarz.pl is the founding brand
  of the Docplanner Group and the Polish locale of the group's marketplace, which also trades as
  Doctoralia, MioDottore, Jameda, Doktor Takvimi and Znamylekar. Its public developer surface is
  the Docplanner Integrations API — an OAuth 2.0 REST API served on the www.znanylekarz.pl host
  that lets medical-software vendors synchronise facilities, doctors, addresses, services,
  insurance providers, calendars, breaks, slots and bookings, and receive push or pull event
  notifications when patients book, move, confirm or cancel visits.
