  note: >-
    Contract discovery hit on the second pass: the Docplanner Integrations API OpenAPI 3.0.3
    (v1.14.0, 32 paths, 44 operations, 82 schemas, 166 examples, 17 typed callbacks) is not served
    as a file anywhere — it is embedded in the __redoc_state of the Redoc docs page at
