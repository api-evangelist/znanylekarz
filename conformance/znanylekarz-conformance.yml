domain_standards:
- id: fhir
  name: HL7 FHIR (Appointment / Schedule / Slot / Practitioner resources)
  conforms: false
  evidence: >-
    Checked and absent. The scheduling domain has a mature standard whose Slot, Schedule,
    Appointment, Practitioner, Location and Organization resources map almost one-to-one onto this
    API's Slot, Calendar, Booking, Doctor, Address and Facility. Nothing in the contract references
    it: no FHIR media type (application/fhir+json), no resourceType member on any of the 82
    schemas, no canonical URL, no CapabilityStatement. Field names are bespoke (since/till,
    address_service, is_price_from). An EHR that already speaks FHIR needs a purpose-built
    connector for this API.
  source: openapi/znanylekarz-integrations-api.yml
