x-generated: '2026-09-05'
x-method: generated
x-source: openapi/znanylekarz-integrations-api.yml
x-note: 'Non-destructive overlay over the provider''s own OpenAPI 1.14.0. It does two things and nothing else: it
  adds the resolved Polish locale server next to the templated one, and it fills the single systematic gap in an
  otherwise strong contract — every one of the 44 operations has a description, tags, an operationId and $ref''d
  examples, but NONE has a summary, so reference renderers and agent tool-listings have no short label to show.
  Summaries here are humanized operationIds, which introduces no claim the spec does not already make. The original
  spec is never mutated.'
x-gaps-not-fixed:
- No idempotency mechanism — cannot be added by overlay; it is a server behaviour.
- No machine-readable error code in the error envelope.
- No request-id / correlation header.
- No reversal windows stated for cancelBooking or moveBooking.
- No published numeric values for the hourly and per-minute rate limits.
actions:
- target: $
  description: Add the resolved Polish locale server. ZnanyLekarz is the pl locale of the Docplanner marketplace;
    the specification's Fundamentals section maps Poland -> znanylekarz.pl, so https://www.znanylekarz.pl/api/v3/integration
    is the concrete form of the templated https://www.{domain}/api/v3/integration base. The templated server is
    NOT removed.
  update:
    servers:
    - url: https://www.{domain}/api/v3/integration
      description: \{domain} - locale of docplanner marketplace ex. znanylekarz.pl
    - url: https://www.znanylekarz.pl/api/v3/integration
      description: ZnanyLekarz (Poland, pl locale) — resolved from the templated server using the locale table in
        the Fundamentals section of this specification.
      x-added-by: api-evangelist-overlay
      x-locale: pl
