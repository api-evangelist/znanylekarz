note: >-
  ZnanyLekarz publishes list prices for the practitioner-facing product, in PLN, monthly, net of
  VAT. There is NO priced plan for the Docplanner Integrations API itself: API access is not sold
  as a tier, it is granted to medical-software vendors through a partner onboarding process
  (sandbox request form, then kick-off with a Docplanner specialist, then production credentials).
  The tiers below are therefore the price of the platform the API integrates with, not the price
  of the API. External integrations are named as a VIP-tier capability, which is the closest the
  published pricing comes to gating API-adjacent functionality.
